services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyOrganizationDs\Controller\:
        resource: '../../Controller/'
        tags: ['controller.service_arguments']

    # The identity form asks for the address repository, so the form registry
    # must take it from here rather than build it itself.
    Wexample\SymfonyOrganizationDs\Form\:
        resource: '../../Form/'

    Wexample\SymfonyOrganizationDs\Service\:
        resource: '../../Service/'

    Wexample\SymfonyOrganizationDs\Twig\:
        resource: '../../Twig/'
